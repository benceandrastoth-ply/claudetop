# Builds the Linux AppImage, .deb and Arch package on a Linux machine.
# On a published release it attaches them to that release; run it by hand to just build them
# (they're kept as a workflow artifact for testing).
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # fpm needs bsdtar to make the Arch (pacman) package
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npx electron-builder --linux AppImage deb pacman --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: claudetop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pkg.tar.xz
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage dist/*.deb dist/*.pkg.tar.xz --clobber

  # Installs the Arch package on a real Arch Linux and checks every library it needs is there.
  arch-check:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claudetop-linux
      - run: pacman -Syu --noconfirm
      - run: pacman -U --noconfirm ./*.pkg.tar.xz
      - name: No missing libraries
        run: |
          if ldd /opt/claudetop/claudetop | grep 'not found'; then exit 1; fi
          test -x /usr/bin/claudetop
          test -f /usr/share/applications/claudetop.desktop
      - run: pacman -R --noconfirm claudetop && test ! -e /usr/bin/claudetop
