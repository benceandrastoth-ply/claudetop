# Publishes website/ to GitHub Pages whenever it, or the Claude its playground runs, changes on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/index.html'
      - 'src/renderer.js'
      - 'src/style.css'
      - 'scripts/build-playground.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy the app's Claude into the playground
        run: node scripts/build-playground.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
