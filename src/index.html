<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>claudetop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fx"></div>
  <div id="claude" class="resting">
    <div class="info" id="info"></div>
    <div class="bubble" id="bubble"></div>
    <div class="zzz"><span>z</span><span>z</span><span>Z</span></div>
    <div class="bolts"><span>⚡</span><span>⚡</span><span>⚡</span></div>
    <div class="notes"><span>♪</span><span>♫</span><span>♬</span><span>♪</span><span>♩</span><span>♫</span></div>
    <div class="sprite" id="sprite">
      <div class="bob">
        <svg viewBox="0 0 16 10" width="96" height="60" shape-rendering="crispEdges">
          <g class="legs-a">
            <rect x="3" y="7" width="1" height="3" />
            <rect x="10" y="7" width="1" height="3" />
          </g>
          <g class="legs-b">
            <rect x="5" y="7" width="1" height="3" />
            <rect x="12" y="7" width="1" height="3" />
          </g>
          <rect class="body" x="2" y="0" width="12" height="7.01" />
          <g class="suit">
            <rect class="jacket" x="2" y="4.4" width="12" height="2.61" />
            <rect class="shirt" x="6.8" y="4.4" width="2.4" height="1.4" />
            <rect class="tie" x="7.6" y="4.4" width="0.8" height="2.4" />
            <rect class="tie" x="7.4" y="4.4" width="1.2" height="0.6" />
            <rect class="barcode" x="2.4" y="0.6" width="0.2" height="1.3" />
            <rect class="barcode" x="2.8" y="0.6" width="0.35" height="1.3" />
            <rect class="barcode" x="3.3" y="0.6" width="0.15" height="1.3" />
            <rect class="barcode" x="3.6" y="0.6" width="0.3" height="1.3" />
            <rect class="barcode" x="4.05" y="0.6" width="0.15" height="1.3" />
            <rect class="brow47" x="4.4" y="1.4" width="2.2" height="0.5" />
            <rect class="brow47" x="9.4" y="1.4" width="2.2" height="0.5" />
          </g>
          <rect class="arm arm-l" x="0" y="3" width="2" height="2" />
          <rect class="arm arm-r" x="14" y="3" width="2" height="2" />
          <g class="eyes-open">
            <rect x="5" y="2" width="1" height="2" />
            <rect x="10" y="2" width="1" height="2" />
          </g>
          <g class="eyes-closed">
            <rect x="4.5" y="3" width="2" height="0.6" />
            <rect x="9.5" y="3" width="2" height="0.6" />
          </g>
          <g class="eyes-panic">
            <rect x="4.5" y="1.5" width="2" height="2.5" />
            <rect x="9.5" y="1.5" width="2" height="2.5" />
            <rect class="shine" x="5.5" y="1.8" width="0.7" height="0.7" />
            <rect class="shine" x="10.5" y="1.8" width="0.7" height="0.7" />
          </g>
          <g class="blush">
            <rect x="3.3" y="4.3" width="1.6" height="0.7" />
            <rect x="11.1" y="4.3" width="1.6" height="0.7" />
          </g>
          <g class="brows">
            <rect x="4" y="1" width="2.4" height="0.6" transform="rotate(25 5.2 1.3)" />
            <rect x="9.6" y="1" width="2.4" height="0.6" transform="rotate(-25 10.8 1.3)" />
          </g>
          <g class="eyes-happy">
            <rect x="4.4" y="3" width="0.75" height="0.75" />
            <rect x="5.1" y="2.3" width="0.75" height="0.75" />
            <rect x="5.8" y="3" width="0.75" height="0.75" />
            <rect x="9.4" y="3" width="0.75" height="0.75" />
            <rect x="10.1" y="2.3" width="0.75" height="0.75" />
            <rect x="10.8" y="3" width="0.75" height="0.75" />
          </g>
          <g class="hat hard">
            <rect class="hat-shell" x="4" y="-4" width="8" height="1" />
            <rect class="hat-shell" x="3" y="-3" width="10" height="2" />
            <rect class="hat-ridge" x="7.5" y="-4" width="1" height="3" />
            <rect class="hat-shine" x="4" y="-3" width="1" height="1" />
            <rect class="hat-brim" x="1" y="-1" width="14" height="1" />
          </g>
          <g class="hat miner">
            <polygon class="beam" points="13.4,-2.6 23,-5.5 23,1.2 13.4,-1.6" />
            <rect class="hat-shell" x="4" y="-4" width="8" height="1" />
            <rect class="hat-shell" x="3" y="-3" width="10" height="2" />
            <rect class="hat-ridge" x="7.5" y="-4" width="1" height="3" />
            <rect class="hat-brim" x="1" y="-1" width="14" height="1" />
            <rect class="lamp-base" x="11.2" y="-2.9" width="1.8" height="1.6" />
            <rect class="lamp" x="12.6" y="-2.7" width="0.9" height="1.2" />
          </g>
          <g class="shovel">
            <rect class="sh-grip" x="14.5" y="-3.6" width="1.6" height="0.6" />
            <rect class="sh-handle" x="15" y="-3" width="0.6" height="12" />
            <rect class="sh-blade" x="14.2" y="9" width="2.2" height="2.4" />
            <rect class="sh-blade" x="14.6" y="11.4" width="1.4" height="0.6" />
          </g>
          <g class="hat propeller">
            <rect class="pc-red" x="5" y="-2.6" width="1" height="0.6" />
            <rect class="pc-yellow" x="6" y="-2.6" width="2" height="0.6" />
            <rect class="pc-blue" x="8" y="-2.6" width="2" height="0.6" />
            <rect class="pc-green" x="10" y="-2.6" width="1" height="0.6" />
            <rect class="pc-red" x="4" y="-2" width="2" height="2" />
            <rect class="pc-yellow" x="6" y="-2" width="2" height="2" />
            <rect class="pc-blue" x="8" y="-2" width="2" height="2" />
            <rect class="pc-green" x="10" y="-2" width="2" height="2" />
            <rect class="pc-visor" x="11" y="-0.6" width="3.5" height="0.6" />
            <rect class="pc-stem" x="7.75" y="-3.6" width="0.5" height="1" />
            <g class="prop">
              <rect class="pc-red" x="4.5" y="-4.1" width="3.5" height="0.6" />
              <rect class="pc-blue" x="8" y="-4.1" width="3.5" height="0.6" />
              <rect class="pc-hub" x="7.55" y="-4.25" width="0.9" height="0.9" />
            </g>
          </g>
          <!-- seasonal hats (only without a hat of your own) -->
          <g class="hat pumpkin">
            <rect class="pk" x="4" y="-3" width="8" height="3" />
            <rect class="pk" x="5" y="-3.6" width="6" height="0.8" />
            <rect class="pk-rib" x="6.6" y="-3.4" width="0.4" height="3.2" />
            <rect class="pk-rib" x="9" y="-3.4" width="0.4" height="3.2" />
            <rect class="pk-face" x="5.2" y="-2.4" width="1" height="0.8" />
            <rect class="pk-face" x="9.8" y="-2.4" width="1" height="0.8" />
            <rect class="pk-face" x="6.4" y="-1.2" width="3.2" height="0.5" />
            <rect class="pk-stem" x="7.7" y="-4.5" width="0.8" height="1.1" />
          </g>
          <g class="hat santa">
            <rect class="sa" x="3" y="-2.6" width="10" height="2" />
            <rect class="sa" x="5" y="-4" width="6" height="1.6" />
            <rect class="sa" x="9.6" y="-4.6" width="2.6" height="1" />
            <rect class="sa-fur" x="2.5" y="-1" width="11" height="1" />
            <rect class="sa-fur" x="11.8" y="-5.2" width="1.4" height="1.4" />
          </g>
          <g class="hat party">
            <rect class="pa-a" x="5" y="-1.4" width="6" height="1.4" />
            <rect class="pa-b" x="5.8" y="-2.8" width="4.4" height="1.4" />
            <rect class="pa-a" x="6.6" y="-4.2" width="2.8" height="1.4" />
            <rect class="pa-b" x="7.4" y="-5.4" width="1.2" height="1.2" />
            <rect class="pa-pom" x="7.3" y="-6.2" width="1.4" height="0.9" />
          </g>
          <g class="cockade">
            <rect class="ck-g" x="3" y="4.4" width="1.8" height="1.8" />
            <rect class="ck-w" x="3.35" y="4.75" width="1.1" height="1.1" />
            <rect class="ck-r" x="3.65" y="5.05" width="0.5" height="0.5" />
          </g>
          <!-- Agent 47's disguises -->
          <g class="disguise chef">
            <rect class="coat" x="2" y="4.4" width="12" height="2.61" />
            <rect class="coat-btn" x="6.4" y="4.8" width="0.5" height="0.5" />
            <rect class="coat-btn" x="9.1" y="4.8" width="0.5" height="0.5" />
            <rect class="coat-btn" x="6.4" y="6" width="0.5" height="0.5" />
            <rect class="coat-btn" x="9.1" y="6" width="0.5" height="0.5" />
            <rect class="toque" x="4" y="-5.6" width="8" height="2.2" />
            <rect class="toque" x="5" y="-3.6" width="6" height="2.8" />
            <rect class="toque-band" x="4.6" y="-1" width="6.8" height="1" />
          </g>
          <g class="disguise mechanic">
            <rect class="overalls" x="2" y="4.2" width="12" height="2.81" />
            <rect class="overalls" x="4" y="3.2" width="0.9" height="1.2" />
            <rect class="overalls" x="11.1" y="3.2" width="0.9" height="1.2" />
            <rect class="pocket" x="6.5" y="4.8" width="3" height="1.2" />
            <rect class="cap" x="3" y="-1.8" width="10" height="1.9" />
            <rect class="cap" x="4" y="-2.4" width="8" height="0.7" />
            <rect class="cap-brim" x="11" y="-0.5" width="4.2" height="0.6" />
            <rect class="wrench" x="15.2" y="1.6" width="0.6" height="3.2" />
            <rect class="wrench" x="14.7" y="0.9" width="1.6" height="0.9" />
            <rect class="wrench-gap" x="15.3" y="0.9" width="0.4" height="0.5" />
          </g>
          <g class="disguise flamingo">
            <rect class="fl" x="9" y="-5.2" width="1.2" height="5.4" />
            <rect class="fl" x="8.4" y="-7" width="3" height="2" />
            <rect class="fl-beak" x="11.4" y="-6.4" width="1.6" height="0.8" />
            <rect class="fl-tip" x="12.6" y="-5.8" width="0.7" height="0.7" />
            <rect class="fl-eye" x="10.3" y="-6.5" width="0.5" height="0.5" />
            <rect class="fl-wing" x="2" y="2.8" width="3" height="2.6" />
          </g>
          <!-- what it's doing right now: held in the right hand -->
          <g class="tool magnifier">
            <rect class="mg-handle" x="15.4" y="3.4" width="0.6" height="2.2" transform="rotate(35 15.7 4.5)" />
            <circle class="mg-lens" cx="17.5" cy="2.2" r="1.25" />
          </g>
          <g class="tool pencil" transform="rotate(-35 16 4)">
            <rect class="pn-eraser" x="14.4" y="3.6" width="0.6" height="0.8" />
            <rect class="pn-body" x="15" y="3.6" width="3.2" height="0.8" />
            <rect class="pn-wood" x="18.2" y="3.7" width="0.6" height="0.6" />
            <rect class="pn-tip" x="18.8" y="3.85" width="0.4" height="0.3" />
          </g>
          <g class="tool terminal">
            <rect class="tm-body" x="15.2" y="1" width="4.2" height="3.2" />
            <rect class="tm-text" x="15.7" y="1.6" width="0.5" height="0.5" />
            <rect class="tm-text" x="16.4" y="1.7" width="1.8" height="0.3" />
            <rect class="tm-cursor" x="15.7" y="2.8" width="0.8" height="0.4" />
          </g>
          <g class="tool book">
            <rect class="bk-cover" x="15" y="2.2" width="4" height="2.6" />
            <rect class="bk-page" x="15.3" y="2.4" width="1.6" height="2.1" />
            <rect class="bk-page" x="17.1" y="2.4" width="1.6" height="2.1" />
            <rect class="bk-line" x="15.6" y="2.9" width="1" height="0.2" />
            <rect class="bk-line" x="15.6" y="3.5" width="1" height="0.2" />
            <rect class="bk-line" x="17.4" y="2.9" width="1" height="0.2" />
          </g>
          <g class="tool coffee">
            <rect class="cf-mug" x="15.2" y="2.4" width="2" height="2.3" />
            <rect class="cf-mug" x="17.2" y="2.9" width="0.7" height="1.2" />
            <rect class="cf-band" x="15.2" y="3.2" width="2" height="0.5" />
            <rect class="cf-steam" x="15.7" y="1.2" width="0.4" height="0.8" />
            <rect class="cf-steam s2" x="16.5" y="0.6" width="0.4" height="0.8" />
          </g>
          <g class="pad">
            <rect class="pad-body" x="4.2" y="4.4" width="7.6" height="2.2" />
            <rect class="pad-body" x="3.6" y="5" width="1.4" height="2" />
            <rect class="pad-body" x="11" y="5" width="1.4" height="2" />
            <rect class="pad-dpad" x="5" y="5" width="1.4" height="0.5" />
            <rect class="pad-dpad" x="5.45" y="4.55" width="0.5" height="1.4" />
            <rect class="pad-a" x="10" y="4.8" width="0.6" height="0.6" />
            <rect class="pad-b" x="10.8" y="5.4" width="0.6" height="0.6" />
          </g>
          <!-- a very long task: tucked into a sleeping bag -->
          <g class="bag">
            <rect class="bag-body" x="1" y="4.1" width="14" height="5.9" />
            <rect class="bag-hood" x="0.6" y="3.8" width="14.8" height="0.9" />
            <rect class="bag-zip" x="11.6" y="4.7" width="0.3" height="5.2" />
          </g>
          <g class="phones">
            <g class="band-low">
              <rect x="2.2" y="-1.2" width="11.6" height="0.7" />
              <rect x="2.2" y="-1.2" width="0.7" height="2.4" />
              <rect x="13.1" y="-1.2" width="0.7" height="2.4" />
            </g>
            <g class="band-high">
              <rect x="1.6" y="-5" width="12.8" height="0.7" />
              <rect x="1.6" y="-5" width="0.7" height="6.2" />
              <rect x="13.7" y="-5" width="0.7" height="6.2" />
            </g>
            <rect class="cup" x="1" y="0.8" width="1.9" height="2.6" />
            <rect class="cup" x="13.1" y="0.8" width="1.9" height="2.6" />
          </g>
        </svg>
        <div class="sweat"><i></i><i></i></div>
        <div class="puff"></div>
        <div class="tear"></div>
        <div class="tear t2"></div>
        <div class="steam"><i></i><i></i></div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
